<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Inicio</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<link rel="stylesheet" href="./css/style.css">
		<link rel="stylesheet" href="./css/theme.css">
		<link rel="icon" href="./favicon1.jpg" id="pageIcon" type="image/png">
	</head>
	<body>
		<header>
			<nav class="navbar navbar-expand-lg w-100"">
                <div class="container-fluid px-4">
                    <div class="ms-auto" id="themeBtnContainer">
                        <button id="themeBtn" class="theme-btn">☀️</button>
                    </div>
                </div>
            </nav>
        </header>
		<main>
			<div class="card text-center mb-5" style="width: 25rem;">
				<div class="card-body p-4">
					<div class="text-center mb-3">
						<img src="./favicon1.jpg" alt="InkSumos Market" class="img-fluid" id="logoImage" style="max-width: 90px;">
					</div>
					<h3 class="text-center mb-1">
						InkSumos Market
					</h3>
					<h4 class="card-text">
						Bienvenido
					</h4>
					<p class="text-center mb-2">
						Ingresá tu nombre para comenzar
					</p>
					<input type="text" id="txtName" placeholder="Ej: John Doe Primero" autocomplete="off">
					<p id="noticeMessage"></p>
					<button class="btn btn-primary" id="btnContinue">
						Continuar
					</button>
					<button class="btn btn-outline-secondary" id="btnLoginAdmin">
						Admin
					</button>
				</div>
			</div>
		</main>
		<footer>
			<small>
				TP -> Tilcara, Juan Alberto - De Marco, Matias
			</small>
		</footer>
		<script src="./js/index.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
		<script src="./js/theme.js"></script>
	</body>
</html>
